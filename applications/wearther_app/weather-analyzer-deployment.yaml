apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-local-weather
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-analyzer
  template:
    metadata:
      labels:
        app: weather-analyzer
    spec:
      containers:
      - name: analyzer
        image: your-dockerhub-username/weather-analyzer:latest  # Replace with your built image tag
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true  # Required to access hardware I2C busses on the edge node
        volumeMounts:
        - name: i2c-bus
          mountPath: /dev/i2c-1  # Maps host I2C device into the container
      volumes:
      - name: i2c-bus
        hostPath:
          path: /dev/i2c-1
          type: CharDevice